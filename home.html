<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전남소방학교 강의 마스터 · 홈</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --navy:#1B3A5F;
    --text:#2C2C2A;
    --text-sub:#4A4946;
    --text-muted:#767F8C;
    --border:#EFEDE7;
    --border-input:#D9D6CF;
    --ok-bg:#E3F1E4; --ok-fg:#1F6B2B;
    --warn-bg:#FFF2C9; --warn-fg:#7A5B00;
    --err-bg:#FBE0DD; --err-fg:#9B1C12;
    --none-bg:#ECEEF1; --none-fg:#4A5360;
    --info-bg:#E3EBF5; --info-fg:#1B3A5F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#F0F2F5;color:var(--text);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px 16px;}
  header{padding:18px 22px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  header .title{font-size:19px;font-weight:800;color:var(--navy);}
  header .sub{font-size:13px;color:var(--text-sub);margin-top:3px;font-weight:600;}
  .btn{height:36px;padding:0 14px;border-radius:6px;background:#fff;border:1px solid var(--border-input);color:var(--text-sub);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap;}
  .btn:hover{background:#F4F7FA;}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.primary:hover{background:#142a45;}
  .btn.sm{height:30px;padding:0 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:default;}

  /* 로그인 */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  #loginCard{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,0.08);padding:34px 30px;width:100%;max-width:360px;text-align:center;}
  #loginCard .title{font-size:19px;font-weight:800;color:var(--navy);margin-bottom:6px;}
  #loginCard .sub{font-size:13px;color:var(--text-muted);margin-bottom:22px;}
  .pin-box{width:48px;height:56px;border:1.5px solid var(--border-input);border-radius:8px;text-align:center;font-size:22px;font-family:inherit;}
  .pin-box:focus{outline:none;border-color:var(--navy);}
  #loginBtn{width:100%;height:42px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;}
  #loginBtn:disabled{opacity:.6;}
  #loginMsg{display:none;color:var(--err-fg);font-size:12.5px;margin-top:12px;}

  /* 공통 상단 메뉴 */
  .gnav{background:#1B3A5F;color:#fff;}
  .gnav-in{display:flex;align-items:stretch;gap:2px;padding:0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .gnav-in::-webkit-scrollbar{display:none;}
  .gnav-brand{display:flex;align-items:center;font-size:13px;font-weight:800;letter-spacing:-0.2px;padding-right:18px;margin-right:6px;border-right:1px solid rgba(255,255,255,0.22);white-space:nowrap;}
  .gnav-i{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;font-size:14px;font-weight:700;color:rgba(255,255,255,0.82);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;box-sizing:border-box;}
  a.gnav-i:hover{color:#fff;background:rgba(255,255,255,0.08);}
  .gnav-i.on{color:#fff;border-bottom-color:#fff;}
  .gnav-i.off{color:rgba(255,255,255,0.45);cursor:default;}
  .gnav-i small{font-size:10.5px;font-weight:700;border:1px solid rgba(255,255,255,0.35);border-radius:999px;padding:1px 7px;color:rgba(255,255,255,0.6);}
  @media (max-width:640px){
    .gnav-in{padding:0 8px;}
    .gnav-brand{display:none;}
    .gnav-i{padding:0 12px;font-size:13px;}
  }

  /* 바로가기 */
  .dtt{width:100%;table-layout:fixed;min-width:640px;border-collapse:collapse;font-size:13.5px;margin:6px 0 4px;}
  .dtt th,.dtt td{border-bottom:1px solid var(--border,#E5E7EB);padding:7px 8px;text-align:left;vertical-align:top;}
  .dtt th{font-size:12px;color:#6B7280;background:#F7F8FA;white-space:nowrap;}
  .dtt td.nw{white-space:nowrap;}
  .dtx{overflow-x:auto;} .dtt a{color:#1B365D;font-weight:700;}
  .dsec{margin:18px 0 4px;font-size:15px;font-weight:800;color:#1B365D;}
  .dsec small{font-weight:600;color:#6B7280;margin-left:6px;}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;}
  .quick .btn{height:40px;padding:0 16px;font-size:13.5px;}

  /* 카드 */
  .grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start;}
  .grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start;}
  .grid2 #cRoom{grid-column:1 / -1;}
  @media (max-width:980px){ .grid2{grid-template-columns:minmax(0,1fr);} .grid2 #cRoom{grid-column:auto;} }
  .col{display:flex;flex-direction:column;gap:16px;min-width:0;}
  @media (max-width:980px){ .grid{grid-template-columns:minmax(0,1fr);} }
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:16px 18px;}
  .card h2{margin:0;font-size:15.5px;font-weight:800;color:var(--navy);}
  .card .chead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .card .chead .meta{font-size:12.5px;color:var(--text-muted);font-weight:600;}
  .hint{font-size:12px;color:var(--text-muted);line-height:1.5;}
  .empty{padding:14px 2px;color:var(--text-muted);font-size:13.5px;}

  .tag{display:inline-block;border-radius:12px;padding:2px 9px;font-size:11.5px;font-weight:700;line-height:1.5;white-space:nowrap;}
  .t-ok{background:var(--ok-bg);color:var(--ok-fg);}
  .t-warn{background:var(--warn-bg);color:var(--warn-fg);}
  .t-err{background:var(--err-bg);color:var(--err-fg);}
  .t-none{background:var(--none-bg);color:var(--none-fg);}
  .t-ops{background:#E6ECF6;color:#27406B;}
  .ct-기본{background:#E3EBF5;color:#1B3A5F;} .ct-전문{background:#E3F1E4;color:#1F6B2B;}
  .ct-특별{background:#EDE3F5;color:#5B2A86;} .ct-민관{background:#FDEBD3;color:#8A4B00;} .ct-기타{background:#ECEEF1;color:#4A5360;}

  /* 오늘 수업 */
  .tl{list-style:none;margin:0;padding:0;}
  .tl li{display:grid;grid-template-columns:118px minmax(0,1fr) minmax(0,1fr);gap:4px 12px;padding:10px 4px;border-top:1px solid var(--border);align-items:start;}
  .tl li:first-child{border-top:none;}
  .tl li.done{opacity:.55;}
  .tl li.now{background:#F3F8FF;border-radius:8px;}
  .tl .tm{font-size:13px;font-weight:800;color:var(--navy);}
  .tl .tm small{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-top:1px;}
  .tl .sj{font-size:14px;font-weight:700;}
  .tl .co{font-size:12.5px;color:var(--text-sub);margin-top:2px;}
  .tl .co a,.wk a.cn{color:var(--navy);font-weight:700;text-decoration:none;}
  .tl .co a:hover,.wk a.cn:hover{text-decoration:underline;}
  .tl .ro{font-size:13px;color:var(--text-sub);}
  .tl .ins{font-size:13px;margin-top:2px;}
  a.inm{color:var(--navy);font-weight:700;text-decoration:underline dotted;text-underline-offset:3px;} a.inm:hover{text-decoration:underline;}
  .ttwrap{overflow-x:auto;}
  .ttscroll{margin-top:4px;}
  @media (max-width:640px){ .ttscroll{display:none;} }
  table.tt{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed;}
  .tt th.pn{width:78px;text-align:left;font-size:13px;font-weight:800;color:var(--navy);padding:6px 6px;vertical-align:top;}
  .tt th.pn small{display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);}
  .tt th.cn{padding:8px 8px;font-size:13.5px;border-radius:6px;text-align:left;}
  .tt th.cn a{color:var(--navy);font-weight:800;text-decoration:none;} .tt th.cn a:hover{text-decoration:underline;}
  .tt td.blk{padding:7px 9px;vertical-align:top;border-radius:6px;font-size:13px;}
  .tt td.blk.done{opacity:.55;} .tt td.blk.now{box-shadow:0 0 0 2px #2F6FD6 inset;}
  .tt .sj{font-size:14px;font-weight:800;color:#1F2D45;} .tt .ins{font-size:13px;margin-top:3px;} .tt .ro{font-size:12.5px;color:var(--text-sub);margin-top:2px;}
  .tt td.emp{background:#FAFBFC;border-radius:6px;min-height:34px;height:34px;}
  .tt td.emp.nowrow{background:#EAF2FF;} .tt th.pn.nowrow{background:#EAF2FF;border-radius:6px;}
  .tcards{display:none;}
  .tcard{border-radius:8px;padding:8px 10px;margin-top:8px;}
  .ipl{display:block;font-weight:500;font-size:11.5px;color:#5B6676;margin-top:2px;}
  .tcard .tch a{font-weight:800;color:var(--navy);text-decoration:none;font-size:14.5px;}
  .tcr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px;padding:6px 0;border-top:1px solid rgba(0,0,0,.07);margin-top:6px;}
  .tcr.done{opacity:.55;} .tcr.now{background:rgba(47,111,214,.10);border-radius:6px;}
  .tcr .tm{font-size:12.5px;font-weight:800;color:var(--navy);} .tcr .tm small{display:block;font-weight:600;color:var(--text-muted);}
  .tcr .sj{font-size:14px;font-weight:700;} .tcr .ro{font-size:12.5px;color:var(--text-sub);margin-top:2px;}
  @media (max-width:640px){
    .ttwrap{display:none;} .tcards{display:block;}
    .tl li{grid-template-columns:minmax(0,1fr);gap:2px;}
    .tl .tm small{display:inline;margin-left:6px;}
  }

  /* 이번 주 */
  .wk{list-style:none;margin:0;padding:0;}
  .wk li{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:4px 14px;padding:10px 4px;border-top:1px solid var(--border);}
  .wk li:first-child{border-top:none;}
  .wk .cn{font-size:14px;}
  .wk .ds{font-size:12.5px;color:var(--text-sub);margin-top:2px;}
  .wk .st{font-size:12.5px;color:var(--text-sub);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;justify-content:flex-end;}
  @media (max-width:640px){ .wk li{grid-template-columns:minmax(0,1fr);} .wk .st{justify-content:flex-start;} }
  .wknav{display:flex;gap:6px;align-items:center;}

  /* 빈 강의실 */
  .rl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;}
  .rl .k{font-size:12.5px;font-weight:700;color:var(--text-sub);min-width:84px;}
  .rl .tag small{font-size:11px;color:var(--text-muted);}
  .rp{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:4px 0 10px;}
  .rp .c{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#FAFBFC;}
  .rp .c b{display:block;font-size:12.5px;color:var(--navy);}
  .rp .c span{font-size:11.5px;color:var(--text-muted);}
  .rp .c .n{display:block;font-size:15px;font-weight:800;color:var(--text);margin-top:2px;}
  .rp .c.low .n{color:var(--err-fg);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
  .chips .tag{background:var(--ok-bg);color:var(--ok-fg);}

  /* 현황 요약 3카드 */
  .trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:0 0 16px;align-items:stretch;}
  @media (max-width:980px){ .trio{grid-template-columns:minmax(0,1fr);} }
  .trio .card{display:flex;flex-direction:column;}
  .trio .foot{margin-top:auto;padding-top:10px;}
  .trio .sub{font-size:12px;color:var(--text-muted);margin:-6px 0 8px;}
  .tdl{list-style:none;margin:0;padding:0;}
  .tdl li a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px;border-top:1px solid var(--border);color:var(--text);text-decoration:none;font-size:13.5px;}
  .tdl li:first-child a{border-top:none;}
  .tdl li a:hover{background:#F4F7FA;}
  .tdl .n{font-size:18px;font-weight:800;}
  .tdl .n small{font-size:12px;font-weight:700;color:var(--text-muted);margin-left:2px;}
  .tdl .bad .n{color:var(--err-fg);} .tdl .wn .n{color:var(--warn-fg);} .tdl .inf .n{color:var(--navy);} .tdl .zero .n{color:var(--text-muted);}
  .tdl .l small{display:block;font-size:11.5px;color:var(--text-muted);}
  .nsl{list-style:none;margin:0;padding:0;}
  .nsl li{padding:8px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;align-items:flex-start;font-size:13.5px;}
  .nsl li:first-child{border-top:none;}
  .nsl a{color:var(--navy);font-weight:700;text-decoration:none;} .nsl a:hover{text-decoration:underline;}
  .nsl small{display:block;font-size:11.5px;color:var(--text-muted);margin-top:2px;}
  .mst{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .mst .c{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:#FAFBFC;}
  .mst .c span{display:block;font-size:12px;color:var(--text-muted);font-weight:600;}
  .mst .c b{display:block;font-size:22px;color:var(--navy);margin-top:2px;line-height:1.2;}
  .mst .c b small{font-size:12px;font-weight:700;color:var(--text-muted);margin-left:2px;}

  /* 연간 통계 */
  .big{font-size:20px;font-weight:800;color:var(--navy);margin:2px 0 10px;}
  .big small{font-size:13px;font-weight:700;color:var(--text-muted);}
  table.st{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.st th,table.st td{padding:8px 6px;border-top:1px solid var(--border);text-align:right;}
  table.st th:first-child,table.st td:first-child{text-align:left;}
  table.st thead th{border-top:none;background:#F8F9FA;font-size:12.5px;color:var(--text-sub);}
  table.st tfoot td{font-weight:800;background:#F8F9FA;}
  table.st tr.rowlink{cursor:pointer;}
  table.st tr.rowlink:hover td{background:#F4F7FA;}
  table.st td a{color:inherit;text-decoration:none;}
  select{height:32px;border:1px solid var(--border-input);border-radius:6px;padding:0 8px;font-family:inherit;font-size:13px;background:#fff;}

  #msg{display:none;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
  #msg.warn{display:block;background:var(--warn-bg);color:var(--warn-fg);}
  #msg.err{display:block;background:var(--err-bg);color:var(--err-fg);}
  #loading{padding:30px;text-align:center;color:var(--text-muted);}
  @media print{ .gnav,.quick,.btn{display:none !important;} }

  /* 저장된 로그인이 있으면 로그인 화면(배경)을 보여주지 않고 바로 불러오기 */
  #boot{display:none;}
  html.autologin #loginScreen{display:none !important;}
  html.autologin #boot{display:block;padding:90px 20px;text-align:center;color:#5b6575;font-size:14px;}
  .cdesc{font-size:12.5px;color:var(--text-muted);margin:-2px 0 10px;}
  .go{font-weight:400;font-size:11.5px;color:var(--text-muted);margin-left:6px;white-space:nowrap;}
</style>
</head>
<body>
<script>try{if(sessionStorage.getItem('jsfa_dash_pw'))document.documentElement.classList.add('autologin');}catch(e){}window.__autoDone=function(){document.documentElement.classList.remove('autologin');};</script>

<div id="loginScreen">
  <div id="loginCard">
    <div class="title">전남소방학교 강의 마스터</div>

      <div style="display:flex;gap:10px;justify-content:center;margin-bottom:16px;">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="0" aria-label="비밀번호 1번째 자리">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="1" aria-label="비밀번호 2번째 자리">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="2" aria-label="비밀번호 3번째 자리">
        <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-box" data-idx="3" aria-label="비밀번호 4번째 자리">

      <button type="submit" id="loginBtn">로그인</button>

  </div>
</div>

<script>
(function(){
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwLgHlqLhN79N0Rc1ZvtmsOJH5ocu_5faU_qv62IKWEiUOHQ7_0sZNoG8sGSbGCV8e3/exec';
  var KEY_PW = 'jsfa_dash_pw';
  var KEY_ROLE = 'jsfa_dash_role';
  var OPS_NAME = '교육운영팀';
  var DOW = ['일','월','화','수','목','금','토'];

  var plans = [], periods = [], rooms = [], roomSkip = {}, allSessions = [], resv = [], reqs = [], histRows = [];
  var sessionsOk = false;
  var yearSel = '';      // 연간 통계 연도('' = 자동)
  var weekOffset = 0;    // 이번 주 기준 주 이동

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });

      });
      var msgs = [];
      if (a['시트없음'] && a['시트없음'].length) msgs.push('강의배정DB에서 다음 시트를 찾지 못했습니다: ' + a['시트없음'].join(', '));
      if (s.status === 'ok') { allSessions = s.data || []; sessionsOk = true; }
      else { allSessions = []; sessionsOk = false; msgs.push('교과목 편성 현황을 불러오지 못했습니다(' + (s.message || '오류') + ').'); }
      if (msgs.length) showMsg('warn', msgs.join(' / '));
      $('loading').style.display = 'none';
      $('main').style.display = '';
      renderAll();
      (function(){ var m = /^#d=(todo(?::[a-z]+)?|nosubj|month)$/.exec(location.hash), k = m ? m[1] : curDetail; if (k) showDetail(k, true); })();
  }

  document.addEventListener('click', function(e){
    var t = e.target;
    var rl = t && t.closest ? t.closest('tr.rowlink') : null;
    if (rl && !(t.closest && t.closest('a'))) { window.location.href = rl.getAttribute('data-href'); return; }
    if (t && t.getAttribute && t.getAttribute('data-w') != null) {
      var v = t.getAttribute('data-w');
      weekOffset = v === '0' ? 0 : weekOffset + Number(v);
      renderWeek();
    }
  });
  document.addEventListener('change', function(e){
    if (e.target && e.target.id === 'yearSel') { yearSel = e.target.value; renderYear(); }
  });
  $('reloadBtn').addEventListener('click', function(){
    var b = this; b.disabled = true; b.textContent = '불러오는 중...';
    loadAll(getPw(), true).catch(function(err){ showMsg('err', err.message || '불러오지 못했습니다'); }).finally(function(){ b.disabled = false; b.textContent = '새로고침'; });
  });

  /* ---------- 로그인 ---------- */
  var pinBoxes = Array.prototype.slice.call(document.querySelectorAll('.pin-box'));
  function getPin(){ return pinBoxes.map(function(b){ return b.value; }).join(''); }
  function clearPin(){ pinBoxes.forEach(function(b){ b.value = ''; }); pinBoxes[0].focus(); }
  pinBoxes.forEach(function(box, idx){
    box.addEventListener('input', function(){
      box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
      if (box.value && idx < pinBoxes.length - 1) pinBoxes[idx + 1].focus();
      if (box.value && idx === pinBoxes.length - 1) {
        var f = $('loginForm');
        if (f.requestSubmit) f.requestSubmit(); else $('loginBtn').click();
      }
    });
    box.addEventListener('keydown', function(e){
      if (e.key === 'Backspace' && !box.value && idx > 0) { pinBoxes[idx - 1].focus(); pinBoxes[idx - 1].value = ''; }
    });
  });
  pinBoxes[0].focus();

  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var pw = getPin();
    var btn = $('loginBtn'), msg = $('loginMsg');
    msg.style.display = 'none';
    if (pw.length < 4) return;
    btn.disabled = true; btn.textContent = '확인 중...';
    loadAll(pw).catch(function(err){
      if (err.auth === true) msg.textContent = /잠겼/.test(err.message || '') ? err.message : '비밀번호가 올바르지 않습니다.';
      else if (err.auth === false) msg.textContent = err.message || '불러오지 못했습니다';
      else msg.textContent = '서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.';
      msg.style.display = 'block';
      delSess(KEY_PW); delSess(KEY_ROLE); bootClear();
      clearPin();
    }).finally(function(){ btn.disabled = false; btn.textContent = '로그인'; });
  });

  var saved = getPw();
  if (saved) {
    var bc = bootRead(saved), fast = false;
    if (bc) { try { lastSig = JSON.stringify([bc.a, bc.s]); applyBoot(saved, bc.a, bc.s, { status: 'ok', role: bc.role }); fast = true; if (window.__autoDone) window.__autoDone(); } catch(e){ fast = false; lastSig = ''; } }
    loadAll(saved, fast, fast).catch(function(err){
      if (err.auth) { delSess(KEY_PW); delSess(KEY_ROLE); bootClear(); if (fast) location.reload(); return; }
      $('loginScreen').style.display = 'none';
      $('app').style.display = 'block';
      $('loading').style.display = 'none';
      showMsg('err', err.message || '불러오지 못했습니다');
    }).then(window.__autoDone, window.__autoDone);
  }
})();
</script>
<script>
// 강사 이름·"강사관리에서 보기"를 누르면 화면 이동 없이 강사 카드를 현재 화면 위에 띄움(강사관리 화면의 카드를 그대로 사용)
(function(){
  var KEY = 'jsfa_dash_pw';
  var ov = null, fr = null, ready = false, pending = null, shown = false, timer = null;
  function hasPw(){ try { return !!sessionStorage.getItem(KEY); } catch (e) { return false; } }
  function init(){
    if (ov) return;
    ov = document.createElement('div');
    ov.style.cssText = 'display:none;position:fixed;inset:0;z-index:99999;background:rgba(20,20,19,.45);';
    ov.innerHTML = '<div class="icLoad" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700;">강사 정보를 불러오는 중...</div>';
    fr = document.createElement('iframe');
    fr.src = 'instructor-dashboard.html#embed=1';
    fr.title = '강사 정보 카드';
    fr.setAttribute('allowtransparency', 'true');
    fr.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent;color-scheme:normal;';
    ov.appendChild(fr);
    document.body.appendChild(ov);
  }
  function send(){ if (ready && pending !== null) { try { fr.contentWindow.postMessage({type:'jsfa-open-card', id:pending}, '*'); } catch (e) {} } }
  function hide(){ if (!ov) return; ov.style.display = 'none'; document.body.style.overflow = ''; clearTimeout(timer); shown = false; pending = null; }
  function open(id){
    init(); shown = false; pending = id;
    ov.querySelector('.icLoad').style.display = 'flex';
    ov.style.display = 'block'; document.body.style.overflow = 'hidden';
    send();
    clearTimeout(timer);
    // 20초 안에 뜨지 않으면 기존 방식(강사관리 화면으로 이동)으로 대체
    timer = setTimeout(function(){ if (!shown) { hide(); location.href = 'instructor-dashboard.html#i=' + encodeURIComponent(id); } }, 20000);
  }
  window.addEventListener('message', function(e){
    if (!fr || e.source !== fr.contentWindow) return;
    var m = e.data || {};
    if (m.type === 'jsfa-card-ready') { ready = true; send(); }
    else if (m.type === 'jsfa-card-shown') { shown = true; clearTimeout(timer); ov.querySelector('.icLoad').style.display = 'none'; }
    else if (m.type === 'jsfa-card-close') { hide(); }
    else if (m.type === 'jsfa-card-notfound') { window.alert('해당 강사를 강사관리 목록에서 찾지 못했습니다. (강사ID: ' + m.id + ')'); }
  });
  document.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a.inm, #iToDash') : null;
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button) return;
    var m = /#i=([^&]+)/.exec(a.getAttribute('href') || '');
    if (!m || !hasPw()) return;
    var id; try { id = decodeURIComponent(m[1]); } catch (err) { return; }
    e.preventDefault(); open(id);
  }, true);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && ov && ov.style.display === 'block') hide(); });
  // 미리 불러 두어 클릭 시 바로 뜨게 함(로그인된 경우만, 화면이 한가할 때)
  window.addEventListener('load', function(){ if (hasPw()) setTimeout(init, 2500); });
})();
</script>
</body>
