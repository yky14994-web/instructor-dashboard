<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전남소방학교 강의 마스터 · 홈</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --navy:#1B3A5F;
    --text:#2C2C2A;
    --text-sub:#4A4946;
    --text-muted:#767F8C;
    --border:#EFEDE7;
    --border-input:#D9D6CF;
    --ok-bg:#E3F1E4; --ok-fg:#1F6B2B;
    --warn-bg:#FFF2C9; --warn-fg:#7A5B00;
    --err-bg:#FBE0DD; --err-fg:#9B1C12;
    --none-bg:#ECEEF1; --none-fg:#4A5360;
    --info-bg:#E3EBF5; --info-fg:#1B3A5F;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#F0F2F5;color:var(--text);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1280px;margin:0 auto;padding:20px 16px 60px 16px;}
  header{padding:18px 22px;background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.05);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  header .title{font-size:19px;font-weight:800;color:var(--navy);}
  header .sub{font-size:13px;color:var(--text-sub);margin-top:3px;font-weight:600;}
  .btn{height:36px;padding:0 14px;border-radius:6px;background:#fff;border:1px solid var(--border-input);color:var(--text-sub);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;text-decoration:none;white-space:nowrap;}
  .btn:hover{background:#F4F7FA;}
  .btn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
  .btn.primary:hover{background:#142a45;}
  .btn.sm{height:30px;padding:0 10px;font-size:12px;}
  .btn:disabled{opacity:.5;cursor:default;}

  /* 로그인 */
  #loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  #loginCard{background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,0.08);padding:34px 30px;width:100%;max-width:360px;text-align:center;}
  #loginCard .title{font-size:19px;font-weight:800;color:var(--navy);margin-bottom:6px;}
  #loginCard .sub{font-size:13px;color:var(--text-muted);margin-bottom:22px;}
  .pin-box{width:48px;height:56px;border:1.5px solid var(--border-input);border-radius:8px;text-align:center;font-size:22px;font-family:inherit;}
  .pin-box:focus{outline:none;border-color:var(--navy);}
  #loginBtn{width:100%;height:42px;border:none;border-radius:8px;background:var(--navy);color:#fff;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;}
  #loginBtn:disabled{opacity:.6;}
  #loginMsg{display:none;color:var(--err-fg);font-size:12.5px;margin-top:12px;}

  /* 공통 상단 메뉴 */
  .gnav{background:#1B3A5F;color:#fff;}
  .gnav-in{display:flex;align-items:stretch;gap:2px;padding:0 20px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .gnav-in::-webkit-scrollbar{display:none;}
  .gnav-brand{display:flex;align-items:center;font-size:13px;font-weight:800;letter-spacing:-0.2px;padding-right:18px;margin-right:6px;border-right:1px solid rgba(255,255,255,0.22);white-space:nowrap;}
  .gnav-i{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;font-size:14px;font-weight:700;color:rgba(255,255,255,0.82);text-decoration:none;white-space:nowrap;border-bottom:3px solid transparent;box-sizing:border-box;}
  a.gnav-i:hover{color:#fff;background:rgba(255,255,255,0.08);}
  .gnav-i.on{color:#fff;border-bottom-color:#fff;}
  .gnav-i.off{color:rgba(255,255,255,0.45);cursor:default;}
  .gnav-i small{font-size:10.5px;font-weight:700;border:1px solid rgba(255,255,255,0.35);border-radius:999px;padding:1px 7px;color:rgba(255,255,255,0.6);}
  @media (max-width:640px){
    .gnav-in{padding:0 8px;}
    .gnav-brand{display:none;}
    .gnav-i{padding:0 12px;font-size:13px;}
  }

  /* 바로가기 */
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px;}
  .quick .btn{height:40px;padding:0 16px;font-size:13.5px;}

  /* 카드 */
  .grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start;}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0;}
  @media (max-width:980px){ .grid{grid-template-columns:minmax(0,1fr);} }
  .card{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05);padding:16px 18px;}
  .card h2{margin:0;font-size:15.5px;font-weight:800;color:var(--navy);}
  .card .chead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .card .chead .meta{font-size:12.5px;color:var(--text-muted);font-weight:600;}
  .hint{font-size:12px;color:var(--text-muted);line-height:1.5;}
  .empty{padding:14px 2px;color:var(--text-muted);font-size:13.5px;}

  .tag{display:inline-block;border-radius:12px;padding:2px 9px;font-size:11.5px;font-weight:700;line-height:1.5;white-space:nowrap;}
  .t-ok{background:var(--ok-bg);color:var(--ok-fg);}
  .t-warn{background:var(--warn-bg);color:var(--warn-fg);}
  .t-err{background:var(--err-bg);color:var(--err-fg);}
  .t-none{background:var(--none-bg);color:var(--none-fg);}
  .t-ops{background:#E6ECF6;color:#27406B;}
  .ct-기본{background:#E3EBF5;color:#1B3A5F;} .ct-전문{background:#E3F1E4;color:#1F6B2B;}
  .ct-특별{background:#EDE3F5;color:#5B2A86;} .ct-민관{background:#FDEBD3;color:#8A4B00;} .ct-기타{background:#ECEEF1;color:#4A5360;}

  /* 오늘 수업 */
  .tl{list-style:none;margin:0;padding:0;}
  .tl li{display:grid;grid-template-columns:118px minmax(0,1fr) minmax(0,1fr);gap:4px 12px;padding:10px 4px;border-top:1px solid var(--border);align-items:start;}
  .tl li:first-child{border-top:none;}
  .tl li.done{opacity:.55;}
  .tl li.now{background:#F3F8FF;border-radius:8px;}
  .tl .tm{font-size:13px;font-weight:800;color:var(--navy);}
  .tl .tm small{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin-top:1px;}
  .tl .sj{font-size:14px;font-weight:700;}
  .tl .co{font-size:12.5px;color:var(--text-sub);margin-top:2px;}
  .tl .co a,.wk a.cn{color:var(--navy);font-weight:700;text-decoration:none;}
  .tl .co a:hover,.wk a.cn:hover{text-decoration:underline;}
  .tl .ro{font-size:13px;color:var(--text-sub);}
  .tl .ins{font-size:13px;margin-top:2px;}
  a.inm{color:var(--navy);font-weight:700;text-decoration:underline dotted;text-underline-offset:3px;} a.inm:hover{text-decoration:underline;}
  .ttwrap{overflow-x:auto;}
  table.tt{border-collapse:separate;border-spacing:3px;width:100%;table-layout:fixed;}
  .tt th.pn{width:78px;text-align:left;font-size:13px;font-weight:800;color:var(--navy);padding:6px 6px;vertical-align:top;}
  .tt th.pn small{display:block;font-size:11.5px;font-weight:600;color:var(--text-muted);}
  .tt th.cn{padding:8px 8px;font-size:13.5px;border-radius:6px;text-align:left;}
  .tt th.cn a{color:var(--navy);font-weight:800;text-decoration:none;} .tt th.cn a:hover{text-decoration:underline;}
  .tt td.blk{padding:7px 9px;vertical-align:top;border-radius:6px;font-size:13px;}
  .tt td.blk.done{opacity:.55;} .tt td.blk.now{box-shadow:0 0 0 2px #2F6FD6 inset;}
  .tt .sj{font-size:14px;font-weight:800;color:#1F2D45;} .tt .ins{font-size:13px;margin-top:3px;} .tt .ro{font-size:12.5px;color:var(--text-sub);margin-top:2px;}
  .tt td.emp{background:#FAFBFC;border-radius:6px;min-height:34px;height:34px;}
  .tt td.emp.nowrow{background:#EAF2FF;} .tt th.pn.nowrow{background:#EAF2FF;border-radius:6px;}
  .tcards{display:none;}
  .tcard{border-radius:8px;padding:8px 10px;margin-top:8px;}
  .tcard .tch a{font-weight:800;color:var(--navy);text-decoration:none;font-size:14.5px;}
  .tcr{display:grid;grid-template-columns:96px minmax(0,1fr);gap:6px;padding:6px 0;border-top:1px solid rgba(0,0,0,.07);margin-top:6px;}
  .tcr.done{opacity:.55;} .tcr.now{background:rgba(47,111,214,.10);border-radius:6px;}
  .tcr .tm{font-size:12.5px;font-weight:800;color:var(--navy);} .tcr .tm small{display:block;font-weight:600;color:var(--text-muted);}
  .tcr .sj{font-size:14px;font-weight:700;} .tcr .ro{font-size:12.5px;color:var(--text-sub);margin-top:2px;}
  @media (max-width:640px){
    .ttwrap{display:none;} .tcards{display:block;}
    .tl li{grid-template-columns:minmax(0,1fr);gap:2px;}
    .tl .tm small{display:inline;margin-left:6px;}
  }

  /* 이번 주 */
  .wk{list-style:none;margin:0;padding:0;}
  .wk li{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:4px 14px;padding:10px 4px;border-top:1px solid var(--border);}
  .wk li:first-child{border-top:none;}
  .wk .cn{font-size:14px;}
  .wk .ds{font-size:12.5px;color:var(--text-sub);margin-top:2px;}
  .wk .st{font-size:12.5px;color:var(--text-sub);display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;justify-content:flex-end;}
  @media (max-width:640px){ .wk li{grid-template-columns:minmax(0,1fr);} .wk .st{justify-content:flex-start;} }
  .wknav{display:flex;gap:6px;align-items:center;}

  /* 빈 강의실 */
  .rl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;}
  .rl .k{font-size:12.5px;font-weight:700;color:var(--text-sub);min-width:84px;}
  .rl .tag small{font-size:11px;color:var(--text-muted);}
  .rp{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin:4px 0 10px;}
  .rp .c{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#FAFBFC;}
  .rp .c b{display:block;font-size:12.5px;color:var(--navy);}
  .rp .c span{font-size:11.5px;color:var(--text-muted);}
  .rp .c .n{display:block;font-size:15px;font-weight:800;color:var(--text);margin-top:2px;}
  .rp .c.low .n{color:var(--err-fg);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px;}
  .chips .tag{background:var(--ok-bg);color:var(--ok-fg);}

  /* 연간 통계 */
  .big{font-size:20px;font-weight:800;color:var(--navy);margin:2px 0 10px;}
  .big small{font-size:13px;font-weight:700;color:var(--text-muted);}
  table.st{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.st th,table.st td{padding:8px 6px;border-top:1px solid var(--border);text-align:right;}
  table.st th:first-child,table.st td:first-child{text-align:left;}
  table.st thead th{border-top:none;background:#F8F9FA;font-size:12.5px;color:var(--text-sub);}
  table.st tfoot td{font-weight:800;background:#F8F9FA;}
  table.st tr.rowlink{cursor:pointer;}
  table.st tr.rowlink:hover td{background:#F4F7FA;}
  table.st td a{color:inherit;text-decoration:none;}
  select{height:32px;border:1px solid var(--border-input);border-radius:6px;padding:0 8px;font-family:inherit;font-size:13px;background:#fff;}

  #msg{display:none;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;}
  #msg.warn{display:block;background:var(--warn-bg);color:var(--warn-fg);}
  #msg.err{display:block;background:var(--err-bg);color:var(--err-fg);}
  #loading{padding:30px;text-align:center;color:var(--text-muted);}
  @media print{ .gnav,.quick,.btn{display:none !important;} }

  /* 저장된 로그인이 있으면 로그인 화면(배경)을 보여주지 않고 바로 불러오기 */
  #boot{display:none;}
  html.autologin #loginScreen{display:none !important;}
  html.autologin #boot{display:block;padding:90px 20px;text-align:center;color:#5b6575;font-size:14px;}
  .cdesc{font-size:12.5px;color:var(--text-muted);margin:-2px 0 10px;}
  .go{font-weight:400;font-size:11.5px;color:var(--text-muted);margin-left:6px;white-space:nowrap;}
</style>
</head>

<script>
(function(){
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwLgHlqLhN79N0Rc1ZvtmsOJH5ocu_5faU_qv62IKWEiUOHQ7_0sZNoG8sGSbGCV8e3/exec';
  var KEY_PW = 'jsfa_dash_pw';
  var KEY_ROLE = 'jsfa_dash_role';
  var OPS_NAME = '교육운영팀';
  var DOW = ['일','월','화','수','목','금','토'];

  var plans = [], periods = [], rooms = [], roomSkip = {}, allSessions = [];
  var sessionsOk = false;
  var yearSel = '';      // 연간 통계 연도('' = 자동)
  var weekOffset = 0;    // 이번 주 기준 주 이동

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }
  function getPw(){ try { return sessionStorage.getItem(KEY_PW); } catch(e){ return null; } }
  function setSess(k, v){ try { sessionStorage.setItem(k, v); } catch(e){} }
  function delSess(k){ try { sessionStorage.removeItem(k); } catch(e){} }
  function api(body){
    return fetch(WEBAPP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function(res){ return res.json(); });
  }

  /* ---------- 날짜 ---------- */
  function parseYmd(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
    if (!m) return null;
    return { y: +m[1], m: +m[2], d: +m[3], dow: new Date(+m[1], +m[2] - 1, +m[3]).getDay() };
  }
  function md(s){ var p = parseYmd(s); return p ? p.m + '/' + p.d + '(' + DOW[p.dow] + ')' : String(s || ''); }
  function ymd(dt){ return dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2) + '-' + ('0' + dt.getDate()).slice(-2); }
  function addDays(s, n){ var q = parseYmd(s); return ymd(new Date(q.y, q.m - 1, q.d + n)); }
  function mondayOf(s){ var q = parseYmd(s); return addDays(s, -(q.dow === 0 ? 6 : q.dow - 1)); }
  /* 날짜 표기가 조금 달라도(2027-3-30, 2027.03.30, 2027-03-30T00:00 등) YYYY-MM-DD로 맞춤. 해석할 수 없으면 '' */
  function normYmd(v){
    var s = String(v == null ? '' : v).trim(); if (!s) return '';
    if (/^\d{4}-\d{2}-\d{2}T.*Z$/.test(s)) { var t = new Date(s); if (!isNaN(t)) { var k = new Date(t.getTime() + 9 * 3600000); return k.getUTCFullYear() + '-' + ('0' + (k.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + k.getUTCDate()).slice(-2); } }
    var m = /^(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})(?:$|[^\d].*$)/.exec(s); if (!m) return '';
    var out = m[1] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[3]).slice(-2), q = parseYmd(out);
    return q && q.m === +m[2] && q.d === +m[3] ? out : '';
  }
  function todayStr(){ return ymd(new Date()); }

  /* ---------- 데이터 정리 ---------- */
  function isCancelled(p){
    var v = String(p && p['상태'] != null ? p['상태'] : '').replace(/\s+/g, '');
    return v === '취소됨' || v === '취소';
  }
  function planByKey(key){
    for (var i = 0; i < plans.length; i++) if (plans[i]['과정+기수'] === key) return plans[i];
    return null;
  }
  function nameOf(key){ var p = planByKey(key); return p ? String(p['과정명'] || '') + ' ' + String(p['기수'] || '') : String(key || ''); }
  function hasInstr(r){ return !!(String(r['강사ID'] || '').trim() || String(r['강사명'] || '').trim()); }
  function isOps(r){ return !String(r['강사ID'] || '').trim() && String(r['강사명'] || '').trim() === OPS_NAME; }
  function isSubRole(r){ return String(r['강사 역할'] || '') === '보조강사'; }
  function periodInfo(n){
    for (var i = 0; i < periods.length; i++) if (periods[i].n === n) return periods[i];
    return null;
  }
  function validTime(t){ return /^\d{1,2}:\d{2}$/.test(String(t || '')); }
  function toMin(t){ var m = /^(\d{1,2}):(\d{2})$/.exec(String(t || '')); return m ? Number(m[1]) * 60 + Number(m[2]) : null; }
  function periodText(a, b){
    var txt = a === b ? a + '교시' : a + '~' + b + '교시';

  function planRanges(p){

      .map(function(k){ var a = normYmd(p[k[1]]), b = normYmd(p[k[2]]); if (!a && !b) return null; a = a || b; b = b || a; return { kind: k[0], a: a, b: b }; })
      .filter(Boolean);
  }
  /* 강의배정 월 캘린더와 같은 과정명별 색(입교 시작일이 빠른 과정부터 황금각으로 색상 배정) */
  var courseRank = null;
  function courseHue(name){
    if (!courseRank) {
      courseRank = {}; var first = {};
      plans.forEach(function(p){ var n = String(p['과정명'] || ''), d = normYmd(p['입교 시작일']) || '9999'; if (!(n in first) || d < first[n]) first[n] = d; });
      Object.keys(first).sort(function(x, y){ return first[x] < first[y] ? -1 : first[x] > first[y] ? 1 : x < y ? -1 : 1; }).forEach(function(n, i){ courseRank[n] = i; });
    }
    var i = courseRank[name]; if (i == null) { var h = 0; for (var k = 0; k < name.length; k++) h = (h * 31 + name.charCodeAt(k)) % 997; i = h; }

  function courseLink(key, label, date){ return '<a href="lecture-assignment.html#c=' + encodeURIComponent(key) + (date ? '&d=' + date : '') + '&from=home" title="누르면 이 과정의 교과목 편성 화면이 열립니다">' + esc(label) + '</a>'; }

  /* ---------- 오늘 수업 ---------- */
  function sessionsOn(date){
    var map = {}, order = [];
    allSessions.forEach(function(r){
      if (normYmd(r['일자']) !== date) return;
      var key = String(r['개설키'] || ''), p = planByKey(key);
      if (p && isCancelled(p)) return;
      var a = Number(r['시작교시']), b = Number(r['끝교시']);
      if (!isFinite(a) || !isFinite(b)) return;
      var g = key + '|' + a + '|' + b + '|' + r['교과목'] + '|' + (r['반'] || '');
      if (!map[g]) { map[g] = { key: key, a: a, b: b, subj: String(r['교과목'] || ''), klass: String(r['반'] || ''), room: '', rows: [] }; order.push(g); }

  }

  function renderToday(){
    var today = todayStr(), q = parseYmd(today);

    var html = '<div class="chead"><h2>오늘 수업</h2><span class="meta">' + q.m + '월 ' + q.d + '일 (' + DOW[q.dow] + ') · ' + list.length + '건</span></div><div class="cdesc">오늘 진행되는 수업을 교시별·과정별로 보여줍니다. 과정마다 색이 다릅니다. 과정명을 누르면 해당 과정의 오늘 날짜 주간 일정이, <b>강사 이름을 누르면 강사 정보 카드(상세)</b>가 열립니다.</div>';

    // 행: 교시표의 교시 + 수업에 쓰인 교시
    var rowSet = {}; periods.forEach(function(x){ rowSet[x.n] = true; });

    var rows = Object.keys(rowSet).map(Number).sort(function(x, y){ return x - y; });

    var cols = [], colOf = {};
    list.forEach(function(o){
      var key = o.key; colOf[key] = colOf[key] || [];

      for (var i = 0; i < colOf[key].length; i++) {
        var c = colOf[key][i];
        if (!c.blocks.some(function(b){ return !(o.b < b.a || o.a > b.b); })) { lane = i; break; }
      }
      if (lane < 0) { var nc = { key: key, lane: colOf[key].length, blocks: [], first: o.a }; colOf[key].push(nc); cols.push(nc); lane = nc.lane; }

    cols.sort(function(x, y){ return x.first - y.first || (x.key < y.key ? -1 : x.key > y.key ? 1 : 0) || x.lane - y.lane; });
    function stateOf(o){

            '<div class="ins">' + instrHtml(blk.rows) + '</div><div class="ro">' + (blk.room ? esc(blk.room) : '<span class="hint">강의실 미정</span>') + '</div></td>';

          '<div class="ro">' + (o.room ? esc(o.room) : '<span class="hint">강의실 미정</span>') + ' · ' + instrHtml(o.rows) + '</div></div></div>';

  /* ---------- 이번 주 과정 ---------- */
  function renderWeek(){
    var base = addDays(mondayOf(todayStr()), weekOffset * 7);
    var end = addDays(base, 6);
    var weekdays = []; for (var i = 0; i < 5; i++) weekdays.push(addDays(base, i));
    var items = [];
    plans.forEach(function(p){
      if (isCancelled(p)) return;
      var key = String(p['과정+기수'] || ''); if (!key) return;
      var hit = planRanges(p).filter(function(r){ return r.a <= end && r.b >= base; });
      var sess = allSessions.filter(function(r){ var d = normYmd(r['일자']); return String(r['개설키'] || '') === key && d >= base && d <= end; });
      if (!hit.length && !sess.length) return;
      // 교과목 묶음(같은 일자·교시·교과목은 1개), 모든 반에 강사가 있어야 배정됨
      var groups = {};
      sess.forEach(function(r){
        var g = normYmd(r['일자']) + '|' + r['시작교시'] + '|' + r['끝교시'] + '|' + r['교과목'];

      var days = 0;

      var a = String(x.p['입교 시작일'] || '9999'), b = String(y.p['입교 시작일'] || '9999');

        '<div class="ds">' + esc(seg) + (rm ? ' · ' + esc(rm) : '') + '</div></div><div class="st">' + st + '</div></li>';

  /* ---------- 오늘 빈 강의실 ---------- */
  function roomNorm(x){ return String(x || '').replace(/\s+/g, ''); }
  /* 연간계획 '예정 강의실' 글자에서 강의실 목록 이름 찾기: 이름이 같으면 그것만, 없으면 끝부분이 같은 이름 전부 */
  function planRoomNames(txt){
    var out = {};
    String(txt || '').split(/[,\/\n·、]+/).forEach(function(tk){
      var n = roomNorm(tk); if (!n) return;
      var ex = rooms.filter(function(r){ return roomNorm(r) === n; });
      if (!ex.length) ex = rooms.filter(function(r){ var rn = roomNorm(r); return rn.length > n.length && rn.slice(-n.length) === n; });
      if (!ex.length) out[String(tk).trim()] = true;
      ex.forEach(function(r){ out[r] = true; });
    });
    return Object.keys(out);
  }
  /* 날짜·교시 범위에서 사용 중인 강의실 집합 (편성된 교과목 + 교과목 편성 전 과정의 연간계획 예정 강의실) */
  function roomsUsed(date, s, e){
    var use = {}, hasRoomSess = {};
    allSessions.forEach(function(r){
      if (normYmd(r['일자']) !== date) return;
      var key = String(r['개설키'] || ''), p = planByKey(key); if (p && isCancelled(p)) return;
      var rmTxt = String(r['강의실'] || '').trim(); if (!rmTxt) return;
      if (!isOps(r)) hasRoomSess[key] = true;
      var a = Number(r['시작교시']), b = Number(r['끝교시']);
      if (!isFinite(a) || !isFinite(b)) { a = 0; b = 99; }
      if (b < s || a > e) return;
      planRoomNames(rmTxt).forEach(function(rm){ use[rm] = true; });
    });
    var q = parseYmd(date), wk = q && q.dow !== 0 && q.dow !== 6;
    if (wk) plans.forEach(function(p){
      if (isCancelled(p)) return;
      var key = String(p['과정+기수'] || ''); if (!key || hasRoomSess[key]) return;
      var a = normYmd(p['입교 시작일']), b = normYmd(p['입교 종료일']); if (!a && !b) return; a = a || b; b = b || a;
      if (date < a || date > b) return;
      planRoomNames(p['예정 강의실']).forEach(function(rm){ use[rm] = true; });
    });
    return use;
  }
  function renderRoom(){

      $('cRoom').innerHTML = html + '<div class="empty">강의실 목록(강의배정DB 강의실 시트)이 비어 있어 계산할 수 없습니다.</div>';
      return;
    }
    var pn = periods.length ? periods.map(function(x){ return x.n; }) : [1, 2, 3, 4, 5, 6, 7];
    var usedBy = {};   // 강의실 -> 사용 교시 목록
    pn.forEach(function(n){ var use = roomsUsed(today, n, n); target.forEach(function(r){ if (use[r]) (usedBy[r] = usedBy[r] || []).push(n); }); });
    function ranges(a){
      var out = [], st = a[0], pv = a[0];
      for (var k = 1; k <= a.length; k++) {
        if (k < a.length && a[k] === pv + 1) { pv = a[k]; continue; }

    var busy = target.filter(function(r){ return usedBy[r]; });
    html += '<div class="rl"><span class="k">종일 비어 있음</span>' + (whole.length ? whole.map(function(r){ return '<span class="tag t-ok">' + esc(r) + '</span>'; }).join('') : '<span class="meta">없음</span>') + '</div>' +
      (busy.length ? '<div class="rl"><span class="k">사용 중</span>' + busy.map(function(r){ return '<span class="tag t-none">' + esc(r) + ' <small>' + ranges(usedBy[r]) + '</small></span>'; }).join('') + '</div>' : '') +
      '<div style="margin-top:10px;"><a class="btn sm" data-v="room" href="lecture-assignment.html#v=room&d=' + today + '">빈 강의실 찾기</a></div>';

  /* ---------- 연간 교육훈련 계획 통계 ---------- */
  function planYears(){
    var years = {};
    plans.forEach(function(p){ var d = normYmd(p['입교 시작일']); if (d) { var y = d.slice(0, 4); years[y] = (years[y] || 0) + 1; } });
    return years;
  }
  function pickYear(years){
    var ys = Object.keys(years).sort(), cur = String(new Date().getFullYear());
    if (years[cur]) return cur;
    var pick = ys[0];
    ys.forEach(function(y){ if (years[y] >= years[pick]) pick = y; });
    return pick || '';
  }
  function renderYear(){
    var years = planYears(), ys = Object.keys(years).sort();
    if (!yearSel || !years[yearSel]) yearSel = pickYear(years);

    if (!ys.length) { $('cYear').innerHTML = html + '<div class="empty">연간계획 데이터가 없습니다.</div>'; $('cYear').style.display = ''; return; }
    var names = {}, byType = {}, cancelled = 0, total = { c: 0, n: 0, p: 0 };
    plans.forEach(function(p){
      var d = normYmd(p['입교 시작일']); if (!d || d.slice(0, 4) !== yearSel) return;
      if (isCancelled(p)) { cancelled++; return; }
      var t = ['기본', '전문', '특별', '민관'].indexOf(String(p['구분'] || '')) > -1 ? String(p['구분']) : '기타';
      var b = byType[t] = byType[t] || { names: {}, n: 0, p: 0 };
      var nm = String(p['과정명'] || ''), ppl = Number(p['계획인원']); if (!isFinite(ppl)) ppl = 0;
      b.names[nm] = true; b.n++; b.p += ppl; names[nm] = true; total.n++; total.p += ppl;
    });
    total.c = Object.keys(names).length;
    var order = ['기본', '전문', '특별', '민관', '기타'].filter(function(t){ return byType[t]; });
    html += '<div class="big">' + total.c + '과정 ' + total.n + '회 ' + total.p.toLocaleString('ko-KR') + '명 <small>' + yearSel + '년 계획 기준</small></div>' +
      '<table class="st"><thead><tr><th>구분</th><th>과정</th><th>회</th><th>인원(명)</th></tr></thead><tbody>' +
      order.map(function(t){ var b = byType[t], href = t === '기타' ? '' : 'lecture-assignment.html#v=table&y=' + encodeURIComponent(yearSel) + '&t=' + encodeURIComponent(t); return '<tr' + (href ? ' class="rowlink" data-href="' + href + '" title="' + t + ' 과정 목록 보기"' : '') + '><td>' + (href ? '<a href="' + href + '">' : '') + '<span class="tag ' + typeCls(t) + '">' + t + '</span>' + (href ? '<span class="go">목록 보기 →</span></a>' : '') + '</td><td>' + Object.keys(b.names).length + '</td><td>' + b.n + '</td><td>' + b.p.toLocaleString('ko-KR') + '</td></tr>'; }).join('') +
      '</tbody><tfoot><tr class="rowlink" data-href="lecture-assignment.html#v=table&y=' + encodeURIComponent(yearSel) + '" title="' + yearSel + '년 전체 과정 목록 보기"><td><a href="lecture-assignment.html#v=table&y=' + encodeURIComponent(yearSel) + '">합계</a><span class="go">전체 보기 →</span></td><td>' + total.c + '</td><td>' + total.n + '</td><td>' + total.p.toLocaleString('ko-KR') + '</td></tr></tfoot></table>' +
      '<div class="hint" style="margin-top:8px;">과정 = 과정명 종류, 회 = 기수 수, 인원 = 계획인원 합계(입교 시작일이 ' + yearSel + '년인 기수 기준). 구분 행을 누르면 해당 과정 목록이 열립니다. ' +
      (cancelled ? '취소된 기수 ' + cancelled + '회는 제외했습니다. ' : '') + '</div>' +
      '<div style="margin-top:10px;"><a class="btn sm" href="lecture-assignment.html#v=table">전체 과정 보기</a></div>';
    $('cYear').innerHTML = html; $('cYear').style.display = '';
  }

  function renderAll(){
    renderToday(); renderWeek(); renderRoom(); renderYear();
  }

  /* ---------- 시계 ---------- */
  var lastLoad = '';
  function tickClock(){
    var n = new Date();
    $('clock').textContent = n.getFullYear() + '년 ' + (n.getMonth() + 1) + '월 ' + n.getDate() + '일 (' + DOW[n.getDay()] + ') ' + ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2) + (lastLoad ? ' · 마지막 새로고침 ' + lastLoad : '');
  }
  function updateQuickLinks(){
    var t = todayStr();
    Array.prototype.forEach.call(document.querySelectorAll('a[data-v]'), function(a){ a.setAttribute('href', 'lecture-assignment.html#v=' + a.getAttribute('data-v') + '&d=' + t); });
  }
  tickClock(); updateQuickLinks();
  setInterval(function(){
    tickClock(); updateQuickLinks();
    if ($('main').style.display !== 'none') renderToday();   // 진행 중·종료 표시 갱신
  }, 60000);

  function showMsg(kind, text){
    var m = $('msg'); m.className = kind || ''; m.textContent = text || '';
    if (!kind) m.style.display = 'none';
  }

  /* ---------- 불러오기 ---------- */
  function loadAll(pw, quiet){
    if (!quiet) { $('loading').style.display = 'block'; }
    showMsg('', '');
    return Promise.all([
      api({ action: 'listAssignmentData', password: pw }),
      api({ action: 'listSessions', password: pw }),
      api({ action: 'login', password: pw })
    ]).then(function(res){
      var a = res[0], s = res[1], lg = res[2];
      if (a.status !== 'ok') {
        var err = new Error(a.message || '불러오지 못했습니다');
        err.auth = /인증|비밀번호/.test(a.message || '');
        throw err;
      }
      $('loginScreen').style.display = 'none';
      $('app').style.display = 'block';
      setSess(KEY_PW, pw);
      if (lg && lg.role) setSess(KEY_ROLE, lg.role);
      (function(){ var n = new Date(); lastLoad = ('0' + n.getHours()).slice(-2) + ':' + ('0' + n.getMinutes()).slice(-2); tickClock(); })();
      plans = a['연간계획'] || []; courseRank = null;
      periods = (a['교시표'] || []).map(function(r){
        return { n: Number(r['교시']), start: String(r['시작'] || ''), end: String(r['종료'] || '') };
      }).filter(function(x){ return isFinite(x.n); }).sort(function(x, y){ return x.n - y.n; });
      rooms = (a['강의실'] || []).map(function(r){ return String(r['강의실명'] || ''); }).filter(Boolean);
      roomSkip = {};
      (a['강의실'] || []).forEach(function(r){
        var nm = String(r['강의실명'] || ''); if (!nm) return;
        Object.keys(r).forEach(function(k){
          if (k.replace(/\s+/g, '') === '겹침검사' && /제외/.test(String(r[k] || ''))) roomSkip[nm] = true;
        });
      });
      var msgs = [];
      if (a['시트없음'] && a['시트없음'].length) msgs.push('강의배정DB에서 다음 시트를 찾지 못했습니다: ' + a['시트없음'].join(', '));
      if (s.status === 'ok') { allSessions = s.data || []; sessionsOk = true; }
      else { allSessions = []; sessionsOk = false; msgs.push('교과목 편성 현황을 불러오지 못했습니다(' + (s.message || '오류') + ').'); }
      if (msgs.length) showMsg('warn', msgs.join(' / '));
      $('loading').style.display = 'none';
      $('main').style.display = '';
      renderAll();
    });
  }

  document.addEventListener('click', function(e){
    var t = e.target;
    var rl = t && t.closest ? t.closest('tr.rowlink') : null;
    if (rl && !(t.closest && t.closest('a'))) { window.location.href = rl.getAttribute('data-href'); return; }
    if (t && t.getAttribute && t.getAttribute('data-w') != null) {
      var v = t.getAttribute('data-w');
      weekOffset = v === '0' ? 0 : weekOffset + Number(v);
      renderWeek();
    }
  });
  document.addEventListener('change', function(e){
    if (e.target && e.target.id === 'yearSel') { yearSel = e.target.value; renderYear(); }
  });
  $('reloadBtn').addEventListener('click', function(){
    var b = this; b.disabled = true; b.textContent = '불러오는 중...';
    loadAll(getPw(), true).catch(function(err){ showMsg('err', err.message || '불러오지 못했습니다'); }).finally(function(){ b.disabled = false; b.textContent = '새로고침'; });
  });

  /* ---------- 로그인 ---------- */
  var pinBoxes = Array.prototype.slice.call(document.querySelectorAll('.pin-box'));
  function getPin(){ return pinBoxes.map(function(b){ return b.value; }).join(''); }
  function clearPin(){ pinBoxes.forEach(function(b){ b.value = ''; }); pinBoxes[0].focus(); }
  pinBoxes.forEach(function(box, idx){
    box.addEventListener('input', function(){
      box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
      if (box.value && idx < pinBoxes.length - 1) pinBoxes[idx + 1].focus();
      if (box.value && idx === pinBoxes.length - 1) {
        var f = $('loginForm');
        if (f.requestSubmit) f.requestSubmit(); else $('loginBtn').click();
      }
    });
    box.addEventListener('keydown', function(e){
      if (e.key === 'Backspace' && !box.value && idx > 0) { pinBoxes[idx - 1].focus(); pinBoxes[idx - 1].value = ''; }
    });
  });
  pinBoxes[0].focus();

  $('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    var pw = getPin();
    var btn = $('loginBtn'), msg = $('loginMsg');
    msg.style.display = 'none';
    if (pw.length < 4) return;
    btn.disabled = true; btn.textContent = '확인 중...';
    loadAll(pw).catch(function(err){
      if (err.auth === true) msg.textContent = '비밀번호가 올바르지 않습니다.';
      else if (err.auth === false) msg.textContent = err.message || '불러오지 못했습니다';
      else msg.textContent = '서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요.';
      msg.style.display = 'block';
      delSess(KEY_PW); delSess(KEY_ROLE);
      clearPin();
    }).finally(function(){ btn.disabled = false; btn.textContent = '로그인'; });
  });

  var saved = getPw();
  if (saved) {
    loadAll(saved).catch(function(err){
      if (err.auth) { delSess(KEY_PW); delSess(KEY_ROLE); return; }
      $('loginScreen').style.display = 'none';
      $('app').style.display = 'block';
      $('loading').style.display = 'none';
      showMsg('err', err.message || '불러오지 못했습니다');
    }).then(window.__autoDone, window.__autoDone);
  }
})();
</script>
</body>
</html>
